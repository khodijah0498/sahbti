<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>Chatbot</h2>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="userMessage" placeholder="Type your message here...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById("chatMessages");

    async function sendMessage() {
      const userInput = document.getElementById("userMessage").value.trim();
      if (!userInput) {
        alert("Please enter a message.");
        return;
      }

      // Add user message to chat
      const userMessageElement = document.createElement("div");
      userMessageElement.className = "message user";
      userMessageElement.textContent = userInput;
      chatMessages.appendChild(userMessageElement);

      // Clear input field
      document.getElementById("userMessage").value = "";

      // Send the message to the FastAPI backend
      try {
        const response = await fetch("http://127.0.0.1:8000/ai-chatbot", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ role: "user", message: userInput }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          alert(`Error: ${errorData.detail}`);
          return;
        }

        const data = await response.json();

        // Add bot response to chat
        const botMessageElement = document.createElement("div");
        botMessageElement.className = "message bot";
        botMessageElement.textContent = data.response;
        chatMessages.appendChild(botMessageElement);

        // Scroll to the bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (error) {
        console.error("Error communicating with the chatbot:", error);
        alert("Something went wrong. Please try again later.");
      }
    }
  </script>
</body>
